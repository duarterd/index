<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricardo Duarte · Data Analyst & Gestor de Projetos de Dados</title>
<meta name="description" content="Ricardo Duarte, Data Analyst & Gestor de Projetos de Dados na JCDecaux. O percurso profissional como relatório interativo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F2;
  --bg-warm: #F0EDE8;
  --panel: #FFFFFF;
  --ink: #1A1A1A;
  --muted: #6B6560;
  --line: #E8E4DE;
  --line-soft: #F0EDE8;
  --accent: #0D7377;
  --accent-soft: #E6F3F3;
  --accent-2: #14919B;
  --warm: #C45C26;
  --warm-soft: #FDF0E9;
  --violet: #5B4B8A;
  --violet-soft: #F0EDF5;
  --gold: #B8860B;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
  --shadow-hover: 0 4px 12px rgba(0,0,0,.06), 0 16px 40px rgba(0,0,0,.06);
  --display: "Instrument Serif", Georgia, serif;
  --text: "DM Sans", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.05rem;
  line-height: 1.65;
  min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); text-underline-offset: 0.2em; transition: color .15s; }
a:hover { color: var(--accent-2); }
:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}

.wrap { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; }

/* ── Decorative background ── */
.bg-deco {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-deco::before {
  content: "";
  position: absolute;
  width: 600px; height: 600px;
  top: -180px; right: -120px;
  background: radial-gradient(circle, rgba(13,115,119,.07) 0%, transparent 70%);
  border-radius: 50%;
}
.bg-deco::after {
  content: "";
  position: absolute;
  width: 400px; height: 400px;
  bottom: 10%; left: -100px;
  background: radial-gradient(circle, rgba(196,92,38,.05) 0%, transparent 70%);
  border-radius: 50%;
}

#app { position: relative; z-index: 1; }

/* ── Header ── */
.top {
  padding: 1.5rem 0 0;
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: clamp(2rem, 6vw, 3.5rem);
}
.logo-mark {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--text);
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--muted);
  letter-spacing: -0.01em;
}
.logo-mark svg {
  width: 28px; height: 28px;
}
.lang {
  display: inline-flex;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
  font-weight: 600;
  font-size: 0.8rem;
  background: var(--panel);
}
.lang button {
  border: 0;
  background: transparent;
  padding: 0.4rem 0.85rem;
  color: var(--muted);
  transition: all .2s;
}
.lang button[aria-pressed="true"] {
  background: var(--ink);
  color: #fff;
}
.lang button:hover:not([aria-pressed="true"]) { color: var(--ink); }

.hero {
  display: grid;
  gap: 2rem;
  margin-bottom: 2.5rem;
}
@media (min-width: 800px) {
  .hero {
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 3rem;
  }
}

.hero-text h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.8rem, 9vw, 4.8rem);
  line-height: 1.05;
  letter-spacing: -0.03em;
  margin: 0 0 0.75rem;
  color: var(--ink);
}
.role-now {
  font-weight: 500;
  font-size: clamp(1.1rem, 2.2vw, 1.35rem);
  line-height: 1.35;
  margin: 0 0 1.25rem;
  max-width: 32ch;
  color: var(--accent);
}
.intro {
  max-width: 38rem;
  margin: 0 0 1.75rem;
  color: var(--muted);
  font-size: 1.05rem;
}
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font-weight: 600;
  font-size: 0.9rem;
  padding: 0.75rem 1.3rem;
  border: 1.5px solid var(--ink);
  color: var(--ink);
  text-decoration: none;
  border-radius: 999px;
  background: transparent;
  transition: all .2s;
}
.btn.primary {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  transform: translateY(-1px);
}
.btn.primary:hover {
  background: var(--accent);
  border-color: var(--accent);
}

/* Hero illustration card */
.hero-card {
  background: var(--panel);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.5rem;
  width: 100%;
  max-width: 280px;
  margin: 0 auto;
}
@media (min-width: 800px) {
  .hero-card { margin: 0; }
}
.hero-card-visual {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--accent-soft) 0%, #D4EEF0 40%, var(--warm-soft) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.1rem;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,.08);
}
.hero-card-visual img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 15%;
  border-radius: 50%;
  display: block;
}
.hero-card-visual svg {
  width: 70%;
  height: auto;
  opacity: 0.9;
}
.hero-card-meta {
  text-align: center;
}
.hero-card-meta strong {
  display: block;
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 0.15rem;
}
.hero-card-meta span {
  font-size: 0.82rem;
  color: var(--muted);
}

/* ── Panels ── */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.4rem 1.5rem;
  box-shadow: var(--shadow);
  transition: box-shadow .25s;
}
.panel:hover { box-shadow: var(--shadow-hover); }
.panel h2 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 1.35rem;
  letter-spacing: -0.01em;
  line-height: 1.2;
  margin: 0 0 0.2rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.panel h2 .icon {
  display: inline-flex;
  width: 28px; height: 28px;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  flex-shrink: 0;
}
.panel h2 .icon svg { width: 16px; height: 16px; }
.panel .sub {
  font-size: 0.88rem;
  color: var(--muted);
  margin: 0 0 1.15rem;
}

/* ── Filters ── */
.filters {
  margin-bottom: 1rem;
  border-top: none;
  position: relative;
}
.filters::before {
  content: "";
  position: absolute;
  top: 0; left: 1.5rem; right: 1.5rem;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--warm), var(--violet));
  border-radius: 0 0 3px 3px;
  opacity: 0.7;
}
.hint {
  margin: 0.5rem 0 1.2rem;
  max-width: 46rem;
  color: var(--muted);
  font-size: 0.95rem;
}
.fgroup { margin-bottom: 1rem; }
.flabel {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--muted);
  margin: 0 0 0.45rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
}
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 0.42rem 0.9rem;
  border: 1.5px solid var(--line);
  background: var(--bg);
  border-radius: 999px;
  color: var(--muted);
  transition: all .18s;
}
.chip:hover {
  border-color: var(--ink);
  color: var(--ink);
  background: var(--panel);
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
.dot {
  width: 0.5rem; height: 0.5rem;
  border-radius: 50%;
  display: inline-block;
  flex: none;
}
.frow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem 1rem;
}
.status {
  font-size: 0.85rem;
  color: var(--muted);
  margin: 0;
}
.reset {
  font-weight: 600;
  font-size: 0.85rem;
  background: none;
  border: 0;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 0.2em;
  padding: 0.25rem 0;
}
.reset:hover { color: var(--accent-2); }

/* ── KPIs ── */
.kpis {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.75rem;
  margin-bottom: 1rem;
}
@media (min-width: 700px) {
  .kpis { grid-template-columns: repeat(4, 1fr); }
}
.kpi {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 1.15rem 1.2rem 1.25rem;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.kpi::after {
  content: "";
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: var(--kpi-c, var(--accent));
  opacity: 0.8;
}
.kpi:nth-child(1) { --kpi-c: var(--accent); }
.kpi:nth-child(2) { --kpi-c: var(--warm); }
.kpi:nth-child(3) { --kpi-c: var(--violet); }
.kpi:nth-child(4) { --kpi-c: var(--gold); }
.kpi b {
  display: block;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2rem, 5.5vw, 2.8rem);
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.kpi span {
  display: block;
  font-size: 0.82rem;
  color: var(--muted);
  margin-top: 0.4rem;
  line-height: 1.3;
}
.kpi small { font-size: 0.75rem; opacity: 0.7; }

/* ── Grid ── */
.dash {
  display: grid;
  gap: 0.85rem;
  grid-template-columns: 1fr;
}
@media (min-width: 900px) {
  .dash { grid-template-columns: repeat(12, 1fr); }
  .p-time { grid-column: 1 / 9; grid-row: span 4; }
  .p-year { grid-column: 9 / 13; }
  .p-edu, .p-lang { grid-column: 9 / 13; }
  .p-cert { grid-column: 1 / 7; }
  .p-vol { grid-column: 7 / 13; }
  .p-award { grid-column: 1 / 7; }
  .p-proj { grid-column: 7 / 13; }
}

/* ── Timeline ── */
.axis {
  position: relative;
  height: 1.3rem;
  font-size: 0.72rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.axis span { position: absolute; top: 0; padding-left: 0.2rem; }
.plot { position: relative; }
.lines, .band {
  position: absolute;
  top: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
}
.lines { left: 0; right: 0; }
.lines i {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: var(--line-soft);
}
.band {
  background: rgba(13, 115, 119, 0.08);
  border-left: 2px solid var(--accent);
}
.rows { position: relative; z-index: 1; list-style: none; margin: 0; padding: 0; }
.rows > li { border-top: 1px solid var(--line); }
.rows > li:last-child { border-bottom: 1px solid var(--line); }
.row {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  padding: 0.9rem 0 0.8rem;
  transition: opacity .2s;
}
.row.dim { opacity: 0.28; }
.head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  position: relative;
}
.title {
  font-weight: 600;
  font-size: 0.98rem;
  line-height: 1.3;
  color: var(--ink);
  transition: color .15s;
}
.org {
  display: block;
  font-weight: 400;
  font-size: 0.84rem;
  color: var(--muted);
  margin-top: 0.1rem;
}
.dates {
  white-space: nowrap;
  font-size: 0.84rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.dates::after {
  content: "+";
  display: inline-block;
  width: 1.15rem;
  text-align: right;
  font-weight: 600;
  color: var(--accent);
}
.row[aria-expanded="true"] .dates::after { content: "\2212"; }
.row:hover .title { color: var(--accent); }
.track {
  display: block;
  position: relative;
  height: 11px;
  margin-top: 0.5rem;
}
.bar {
  position: absolute;
  top: 1px;
  height: 9px;
  min-width: 6px;
  background: var(--c);
  border-radius: 4px;
  opacity: 0.9;
}
.bar.now {
  box-shadow: inset 0 0 0 2px var(--ink);
  background: var(--warm);
  opacity: 1;
}
.intro-anim .bar {
  transform-origin: left center;
  animation: grow 0.85s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: calc(var(--i) * 65ms + 150ms);
}
@keyframes grow {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
.detail {
  position: relative;
  padding: 0.15rem 0 1.1rem;
  max-width: 42rem;
}
.detail ul { margin: 0; padding-left: 1.15rem; color: var(--muted); font-size: 0.95rem; }
.detail li { margin: 0.28rem 0; }
.tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.85rem; }
.tag {
  font-size: 0.78rem;
  font-weight: 500;
  padding: 0.22rem 0.65rem;
  border: 1.5px solid var(--line);
  background: var(--bg);
  border-radius: 999px;
  color: var(--muted);
  transition: all .15s;
}
.tag:hover { border-color: var(--ink); color: var(--ink); }
.tag[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
.tag.dom {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  border-color: transparent;
  background: var(--bg-warm);
  cursor: default;
}
.empty {
  background: var(--accent-soft);
  border: 1px solid var(--line);
  padding: 0.85rem 1.1rem;
  border-radius: var(--radius-sm);
  margin: 0 0 0.85rem;
  color: var(--muted);
  font-size: 0.92rem;
}

/* ── Yearly bars ── */
.bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 140px;
  border-bottom: 1.5px solid var(--line);
}
.col {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column-reverse;
  padding: 0;
  background: none;
  border: 0;
  border-radius: 0;
}
.col:disabled { cursor: default; }
.seg {
  display: block;
  height: 32px;
  margin-top: 2px;
  background: var(--c);
  border-radius: 3px 3px 0 0;
  transition: filter .15s;
  opacity: 0.9;
}
.bars.pick .col { opacity: 0.3; }
.bars.pick .col[aria-pressed="true"] { opacity: 1; }
.col[aria-pressed="true"] {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-radius: 3px;
}
.col:not(:disabled):hover .seg { filter: brightness(1.08); opacity: 1; }
.years {
  display: flex;
  gap: 2px;
  margin-top: 0.3rem;
  font-size: 0.68rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.years span { flex: 1; min-width: 0; white-space: nowrap; }

/* ── Education & Languages ── */
.edu { list-style: none; margin: 0; padding: 0; }
.edu li {
  padding: 0.9rem 0;
  border-top: 1px solid var(--line);
}
.edu li:first-child { border-top: 0; padding-top: 0; }
.edu strong {
  display: block;
  font-weight: 600;
  font-size: 0.95rem;
  line-height: 1.3;
  color: var(--ink);
}
.edu .meta {
  display: block;
  font-size: 0.84rem;
  color: var(--muted);
  margin-top: 0.15rem;
}
.grade {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  margin-top: 0.5rem;
  font-size: 0.8rem;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  font-weight: 500;
}
.grade i {
  display: block;
  flex: 1;
  height: 5px;
  background: var(--line);
  position: relative;
  border-radius: 999px;
  overflow: hidden;
}
.grade i::after {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: var(--w);
  background: var(--accent);
  border-radius: 999px;
}
.langs { list-style: none; margin: 0; padding: 0; }
.langs li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 0.55rem 0;
  border-top: 1px solid var(--line);
  font-size: 0.92rem;
}
.langs li:first-child { border-top: 0; padding-top: 0; }
.langs .lv {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--muted);
  font-size: 0.8rem;
}
.meter { display: flex; gap: 2px; }
.meter i {
  width: 11px; height: 5px;
  background: var(--line);
  border-radius: 1.5px;
}
.meter i.on { background: var(--accent); }
.meter i.half { background: var(--accent); opacity: 0.4; }

/* ── Contact ── */
.contact {
  margin-top: 0.85rem;
  display: flex;
  flex-wrap: wrap;
  gap: 1.25rem 2rem;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, var(--accent-soft) 0%, var(--warm-soft) 100%);
  border-color: transparent;
}
.contact p {
  margin: 0;
  max-width: 36rem;
  color: var(--muted);
  font-size: 1rem;
}
footer {
  padding: 2rem 0 2.5rem;
  font-size: 0.85rem;
  color: var(--muted);
  text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  .intro-anim .bar { animation: none; }
  .row { transition: none; }
  .btn:hover { transform: none; }
}
</style>
</head>

    '<div class="fgroup"><p class="flabel">' + u.area + '</p><div class="chips">' + dchips + '</div></div>' +
    '<div class="fgroup"><p class="flabel">' + u.tool + '</p><div class="chips">' + tchips + yearChip + '</div></div>' +
    '<div class="frow"><p class="status" aria-live="polite">' + u.status.replace("{n}", shown).replace("{t}", ROLES.length) + '</p>' +
    (any ? '<button class="reset" data-act="reset" data-key="reset">' + u.reset + '</button>' : '') + '</div>' +
    '</section>';
}

function kpis(u, rs){
  var emps = {}, tools = {};
  rs.forEach(function(r){ emps[r.emp] = 1; r.tools.forEach(function(t){ tools[t] = 1; }); });
  var allEmp = {}, allTools = {};
  ROLES.forEach(function(r){ allEmp[r.emp] = 1; r.tools.forEach(function(t){ allTools[t] = 1; }); });
  var nEmp = Object.keys(emps).length, nTools = Object.keys(tools).length;
  var filtered = rs.length !== ROLES.length;
  function sub(tot){ return filtered ? ' <small>' + u.of + ' ' + tot + '</small>' : ''; }
  return '<div class="kpis">' +
    '<div class="kpi"><b>' + fmt1(union(rs)) + '</b><span>' + u.kYears + '</span></div>' +
    '<div class="kpi"><b>' + rs.length + '</b><span>' + u.kRoles + sub(ROLES.length) + '</span></div>' +
    '<div class="kpi"><b>' + nEmp + '</b><span>' + u.kEmp + sub(Object.keys(allEmp).length) + '</span></div>' +
    '<div class="kpi"><b>' + nTools + '</b><span>' + u.kTools + sub(Object.keys(allTools).length) + '</span></div>' +
    '</div>';
}

function timeline(u, shown){
  var lg = S.lang, ticks = "", lines = "";
  for (var y = MIN; y < MAX; y += 4){
    ticks += '<span style="left:' + pct(y) + '%">' + y + '</span>';
    lines += '<i style="left:' + pct(y) + '%"></i>';
  }
  var band = S.year !== null ? '<div class="band" style="left:' + pct(S.year) + '%;width:' + (100 / SPAN).toFixed(2) + '%"></div>' : "";
  var rows = "";
  ROLES.forEach(function(r, idx){
    var open = S.open === r.id;
    var dim = matches(r, true) ? "" : " dim";
    var w = ((end(r) - r.s) / SPAN * 100).toFixed(2);
    var li = "";
    r.b[lg].forEach(function(t){ li += "<li>" + t + "</li>"; });
    var tags = '<span class="tag dom">' + domDot(r.dom) + DOM[r.dom][lg] + '</span>';
    r.tools.forEach(function(k){
      tags += '<button class="tag" data-act="tool" data-v="' + k + '" data-key="tag-' + r.id + '-' + k + '" aria-pressed="' + (S.tool===k) + '">' + TOOLS[k][lg] + '</button>';
    });
    rows += '<li>' +
      '<button class="row' + dim + '" data-act="role" data-v="' + r.id + '" data-key="role-' + r.id + '" aria-expanded="' + open + '" aria-controls="d-' + r.id + '">' +
      '<span class="head"><span class="title">' + r.t[lg] + '<span class="org">' + r.o[lg] + '</span></span><span class="dates">' + r.d[lg] + '</span></span>' +
      '<span class="track"><span class="bar' + (r.now ? " now" : "") + '" style="left:' + pct(r.s) + '%;width:' + w + '%;--i:' + idx + ';--c:' + DOM[r.dom].c + '"></span></span>' +
      '</button>' +
      '<div class="detail" id="d-' + r.id + '"' + (open ? "" : " hidden") + '><ul>' + li + '</ul><div class="tags">' + tags + '</div></div>' +
      '</li>';
  });
  return '<section class="panel p-time" aria-labelledby="h-time">' +
    '<h2 id="h-time"><span class="icon">' + ICO.timeline + '</span>' + u.timeline + '</h2><p class="sub">' + u.timelineSub + '</p>' +
    (shown === 0 ? '<p class="empty">' + u.empty + '</p>' : '') +
    '<div class="axis" aria-hidden="true">' + ticks + '</div>' +
    '<div class="plot' + (S.intro ? " intro-anim" : "") + '"><div class="lines" aria-hidden="true">' + lines + '</div>' + band +
    '<ol class="rows">' + rows + '</ol></div></section>';
}

function yearly(u){
  var lg = S.lang, cols = "", labels = "";
  var rs = ROLES.filter(function(r){ return matches(r, false); });
  for (var y = MIN; y < MAX; y++){
    var act = rs.filter(function(r){ return activeIn(r, y); });
    var segs = "";
    act.forEach(function(r){ segs += '<span class="seg" style="--c:' + DOM[r.dom].c + '"></span>'; });
    cols += '<button class="col" data-act="year" data-v="' + y + '" data-key="col-' + y + '" ' +
      (act.length ? "" : "disabled ") + 'aria-pressed="' + (S.year === y) + '" aria-label="' + y + ': ' + act.length + ' ' + u.roleWord + '">' + segs + '</button>';
    labels += '<span aria-hidden="true">' + (((y - MIN) % 4 === 0) ? y : "") + '</span>';
  }
  var legend = "";
  DOM_ORDER.forEach(function(k){ legend += '<span class="tag dom">' + domDot(k) + DOM[k][lg] + '</span>'; });
  return '<section class="panel p-year" aria-labelledby="h-year">' +
    '<h2 id="h-year"><span class="icon">' + ICO.chart + '</span>' + u.yearly + '</h2><p class="sub">' + u.yearlySub + '</p>' +
    '<div class="bars' + (S.year !== null ? " pick" : "") + '">' + cols + '</div>' +
    '<div class="years">' + labels + '</div>' +
    '<div class="tags">' + legend + '</div></section>';
}

function education(u){
  var lg = S.lang, items = "";
  EDU.forEach(function(e){
    var g = "";
    if (e.grade !== null){
      g = '<div class="grade"><span>' + e.grade + ' / 20</span><i style="--w:' + (e.grade / 20 * 100) + '%"></i></div>';
    }
    var link = e.link ? ' <a href="' + e.link + '" rel="noopener">' + u.thesis + '</a>' : "";
    items += '<li><strong>' + e.t[lg] + '</strong><span class="meta">' + e.i[lg] + ', ' + e.y[lg] + ', ' + e.ects + ' ' + u.ects + link + '</span>' + g + '</li>';
  });
  return '<section class="panel p-edu" aria-labelledby="h-edu"><h2 id="h-edu"><span class="icon">' + ICO.edu + '</span>' + u.edu + '</h2><p class="sub">' + u.eduSub + '</p><ul class="edu">' + items + '</ul></section>';
}

function languages(u){
  var lg = S.lang, items = "";
  LANGS.forEach(function(l){
    var m = "";
    for (var i = 0; i < 6; i++){
      m += '<i class="' + (i < l.on ? "on" : (i < l.on + l.half ? "half" : "")) + '"></i>';
    }
    items += '<li><span>' + l.n[lg] + '</span><span class="lv"><span class="meter" aria-hidden="true">' + m + '</span>' + l.l[lg] + '</span></li>';
  });
  return '<section class="panel p-lang" aria-labelledby="h-lang"><h2 id="h-lang"><span class="icon">' + ICO.lang + '</span>' + u.langs + '</h2><p class="sub">' + u.langsSub + '</p><ul class="langs">' + items + '</ul></section>';
}

function certifications(u){
  var lg = S.lang, items = "";
  CERTS.forEach(function(c){
    items += '<li><strong>' + c.t[lg] + '</strong><span class="meta">' + c.i[lg] + ' · ' + c.y[lg] + '</span></li>';
  });
  return '<section class="panel p-cert" aria-labelledby="h-cert"><h2 id="h-cert"><span class="icon">' + ICO.cert + '</span>' + u.certs + '</h2><p class="sub">' + u.certsSub + '</p><ul class="edu">' + items + '</ul></section>';
}

function volunteers(u){
  var lg = S.lang, items = "";
  VOLS.forEach(function(v){
    items += '<li><strong>' + v.t[lg] + '</strong><span class="meta">' + v.o[lg] + ' · ' + v.d[lg] + '</span><span class="meta" style="display:block;margin-top:.25rem">' + v.c[lg] + '</span></li>';
  });
  return '<section class="panel p-vol" aria-labelledby="h-vol"><h2 id="h-vol"><span class="icon">' + ICO.vol + '</span>' + u.vols + '</h2><p class="sub">' + u.volsSub + '</p><ul class="edu">' + items + '</ul></section>';
}

function awards(u){
  var lg = S.lang, items = "";
  AWARDS.forEach(function(a){
    items += '<li><strong>' + a.t[lg] + '</strong><span class="meta">' + a.o[lg] + ' · ' + a.d[lg] + '</span><span class="meta" style="display:block;margin-top:.35rem;color:var(--muted)">' + a.b[lg] + '</span></li>';
  });
  return '<section class="panel p-award" aria-labelledby="h-award"><h2 id="h-award"><span class="icon">' + ICO.award + '</span>' + u.awards + '</h2><p class="sub">' + u.awardsSub + '</p><ul class="edu">' + items + '</ul></section>';
}

function projects(u){
  var lg = S.lang, items = "";
  PROJS.forEach(function(p){
    var li = "";
    p.b[lg].forEach(function(t){ li += "<li>" + t + "</li>"; });
    items += '<li><strong>' + p.t[lg] + '</strong><span class="meta">' + p.d[lg] + '</span><ul style="margin:.5rem 0 0;padding-left:1.15rem;color:var(--muted);font-size:.95rem">' + li + '</ul></li>';
  });
  return '<section class="panel p-proj" aria-labelledby="h-proj"><h2 id="h-proj"><span class="icon">' + ICO.proj + '</span>' + u.projs + '</h2><p class="sub">' + u.projsSub + '</p><ul class="edu">' + items + '</ul></section>';
}

var app = document.getElementById("app");

function render(){
  var u = UI[S.lang];
  var rs = ROLES.filter(function(r){ return matches(r, true); });
  var activeKey = document.activeElement && document.activeElement.getAttribute ? document.activeElement.getAttribute("data-key") : null;

  document.documentElement.lang = S.lang === "pt" ? "pt-PT" : "en";
  document.title = u.docTitle;

  app.innerHTML = header(u) +
    '<main class="wrap">' +
    filters(u, rs.length) +
    kpis(u, rs) +
    '<div class="dash">' +
      timeline(u, rs.length) +
      yearly(u) +
      education(u) +
      languages(u) +
      certifications(u) +
      volunteers(u) +
      awards(u) +
      projects(u) +
    '</div>' +
    '<section class="panel contact" aria-label="' + (S.lang === "pt" ? "Contacto" : "Contact") + '">' +
    '<p>' + u.contactTxt + '</p>' +
    '<div class="actions"><a class="btn primary" href="mailto:ricardo.duarte.80@gmail.com">' + u.email + '</a>' +
    '<a class="btn" href="https://www.linkedin.com/in/ricardo-duarte-80/" rel="noopener">' + u.linkedin + '</a></div>' +
    '</section>' +
    '</main>' +
    '<footer><div class="wrap">' + u.footer + '</div></footer>';

  S.intro = false;

  if (activeKey){
    var el = app.querySelector('[data-key="' + activeKey + '"]');
    if (el && !el.disabled) el.focus({preventScroll:true});
  }
}

app.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  var act = el.getAttribute("data-act"), v = el.getAttribute("data-v");
  if (act === "lang") S.lang = v;
  else if (act === "dom") S.dom = (v === "" || S.dom === v) ? null : v;
  else if (act === "tool") S.tool = (S.tool === v) ? null : v;
  else if (act === "year"){ var y = parseInt(v, 10); S.year = (S.year === y) ? null : y; }
  else if (act === "role") S.open = (S.open === v) ? null : v;
  else if (act === "reset"){ S.dom = null; S.tool = null; S.year = null; }
  render();
});

render();
})();
</script>
</body>
</html>
