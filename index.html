:root{

  --panel:#FFFFFF;
  --ink:#14202B;
  --muted:#5A6672;

  --text:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:1.05rem;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cobalt);text-underline-offset:.2em}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:3px}
.wrap{max-width:74rem;margin:0 auto;padding:0 1rem}
h1,h2,h3,.ui{font-family:var(--display)}

/* Cabeçalho */
.top{padding:1.25rem 0 1.5rem}
.top-bar{display:flex;justify-content:flex-end;margin-bottom:clamp(1.5rem,5vw,3rem)}
.lang{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;font-family:var(--display);font-weight:600;font-size:.85rem}
.lang button{border:0;background:transparent;padding:.35rem .8rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
h1{font-weight:800;font-size:clamp(2.8rem,10vw,6.5rem);line-height:.92;letter-spacing:-.045em;margin:0 0 1.25rem}
.role-now{font-family:var(--display);font-weight:600;font-size:clamp(1.2rem,3vw,1.7rem);line-height:1.2;letter-spacing:-.01em;margin:0 0 1rem;max-width:30ch}
.intro{max-width:40rem;margin:0 0 1.5rem}
.actions{display:flex;flex-wrap:wrap;gap:.6rem}
.btn{display:inline-block;font-family:var(--display);font-weight:600;font-size:.95rem;padding:.7rem 1.1rem;border:2px solid var(--ink);color:var(--ink);text-decoration:none;border-radius:3px}
.btn.primary{background:var(--ink);color:#fff}
.btn:hover{background:var(--cobalt);border-color:var(--cobalt);color:#fff}

/* Painéis */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1.1rem}
.panel h2{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;line-height:1.2;margin:0 0 .2rem}
.panel .sub{font-family:var(--display);font-size:.9rem;color:var(--muted);margin:0 0 1rem}

/* Filtros */
.filters{border-top:4px solid var(--ink);margin-bottom:.75rem}
.hint{margin:0 0 1rem;max-width:44rem}
.fgroup{margin-bottom:.9rem}
.flabel{font-family:var(--display);font-size:.85rem;font-weight:600;color:var(--muted);margin:0 0 .4rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--display);font-size:.9rem;padding:.4rem .8rem;border:1.5px solid var(--line);background:#fff;border-radius:999px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.dot{width:.6rem;height:.6rem;border-radius:50%;display:inline-block;flex:none}
.frow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem}
.status{font-family:var(--display);font-size:.9rem;color:var(--muted);margin:0}
.reset{font-family:var(--display);font-weight:600;font-size:.9rem;background:none;border:0;color:var(--cobalt);text-decoration:underline;text-underline-offset:.2em;padding:.25rem 0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-bottom:.75rem}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{border-top:3px solid var(--cobalt);background:var(--panel);padding:.9rem 1rem 1rem;border-radius:0 0 6px 6px}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.1rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-family:var(--display);font-size:.9rem;color:var(--muted);margin-top:.4rem;line-height:1.25}
.kpi small{font-size:.8rem}

/* Grelha */
.dash{display:grid;gap:.75rem;grid-template-columns:1fr}
@media (min-width:900px){
  .dash{grid-template-columns:repeat(12,1fr)}
  .p-time{grid-column:1/9;grid-row:span 3}
  .p-year,.p-edu,.p-lang{grid-column:9/13}
}

/* Linha temporal */
.axis{position:relative;height:1.4rem;font-family:var(--display);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span{position:absolute;top:0;padding-left:.3rem}
.plot{position:relative}
.lines,.band{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.lines{left:0;right:0}
.lines i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.band{background:rgba(35,80,216,.12);border-left:2px solid var(--cobalt)}
.rows{position:relative;z-index:1;list-style:none;margin:0;padding:0}
.rows>li{border-top:1px solid var(--line)}
.rows>li:last-child{border-bottom:1px solid var(--line)}
.row{display:block;width:100%;text-align:left;background:none;border:0;padding:.8rem 0 .75rem;transition:opacity .2s}
.row.dim{opacity:.3}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-family:var(--display);background:var(--panel);position:relative}
.title{font-weight:600;font-size:1rem;line-height:1.3}
.org{display:block;font-weight:400;font-size:.88rem;color:var(--muted)}
.dates{white-space:nowrap;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dates::after{
  content:"+";
  display:inline-block;
  width:1.2rem;
  text-align:right;
  font-weight:600;
  color:var(--ink);
}
.row[aria-expanded="true"] .dates::after{content:"\2212"}
.row:hover .title{color:var(--cobalt)}
.track{display:block;position:relative;height:14px;margin-top:.55rem}
.bar{position:absolute;top:2px;height:10px;min-width:6px;background:var(--c)}
.bar.now{box-shadow:inset 0 0 0 2px var(--ink);background:var(--signal)}
.intro-anim .bar{transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 70ms + 200ms)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.detail{background:var(--panel);position:relative;padding:.25rem 0 1.1rem;max-width:42rem}
.detail ul{margin:0;padding-left:1.15rem}
.detail li{margin:.3rem 0}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.85rem}
.tag{font-family:var(--display);font-size:.82rem;padding:.25rem .65rem;border:1.5px solid var(--line);background:#fff;border-radius:999px}
.tag:hover{border-color:var(--ink)}
.tag[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tag.dom{display:inline-flex;align-items:center;gap:.4rem;border-color:transparent;background:var(--bg);cursor:default}
.empty{font-family:var(--display);background:var(--bg);padding:.75rem 1rem;border-radius:4px;margin:0 0 .75rem}

/* Funções por ano */
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1.5px solid var(--ink)}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column-reverse;padding:0;background:none;border:0;border-radius:0}
.col:disabled{cursor:default}
.seg{display:block;height:36px;margin-top:2px;background:var(--c)}
.bars.pick .col{opacity:.3}
.bars.pick .col[aria-pressed="true"]{opacity:1}
.col[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.col:not(:disabled):hover .seg{filter:brightness(1.12)}
.years{display:flex;gap:3px;margin-top:.3rem;font-family:var(--display);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.years span{flex:1;min-width:0;white-space:nowrap}

.edu{list-style:none;margin:0;padding:0}
.edu li{padding:.85rem 0;border-top:1px solid var(--line)}
.edu li:first-child{border-top:0;padding-top:0}
.edu strong{display:block;font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.3}
.edu .meta{display:block;font-family:var(--display);font-size:.88rem;color:var(--muted)}
.grade{display:flex;align-items:center;gap:.6rem;margin-top:.45rem;font-family:var(--display);font-size:.85rem;font-variant-numeric:tabular-nums}
.grade i{display:block;flex:1;height:6px;background:var(--line);position:relative}

  position:absolute;
  left:0;
  top:0;
  bottom:0;

.langs{list-style:none;margin:0;padding:0}
.langs li{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.55rem 0;border-top:1px solid var(--line);font-family:var(--display);font-size:.95rem}
.langs li:first-child{border-top:0;padding-top:0}
.langs .lv{display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:.85rem}
.meter{display:flex;gap:2px}
.meter i{width:12px;height:6px;background:var(--line)}
.meter i.on{background:var(--cobalt)}
.meter i.half{background:var(--cobalt);opacity:.45}

/* Contacto */
.contact{margin-top:.75rem;display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;justify-content:space-between}
.contact p{margin:0;max-width:34rem}
footer{padding:1.5rem 0 2.5rem;font-family:var(--display);font-size:.88rem;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  .intro-anim .bar{animation:none}
  .row{transition:none}
}
</style>
</head>

/* ---------- Estado ---------- */
var S = {
  lang: (navigator.language || "pt").toLowerCase().indexOf("pt") === 0 ? "pt" : "en",
  dom: null, tool: null, year: null, open: "jc", intro: true
};

/* ---------- Utilitários ---------- */
function end(r){ return r.e === null ? NOW : r.e; }
function activeIn(r, y){ return Math.min(end(r), y + 1) - Math.max(r.s, y) > 0.2; }
function matches(r, useYear){
  if (S.dom && r.dom !== S.dom) return false;
  if (S.tool && r.tools.indexOf(S.tool) < 0) return false;
  if (useYear && S.year !== null && !activeIn(r, S.year)) return false;
  return true;
}
function union(rs){
  var iv = rs.map(function(r){ return [r.s, end(r)]; }).sort(function(a,b){ return a[0]-b[0]; });
  var tot = 0, cs = null, ce = null;
  iv.forEach(function(p){
    if (cs === null){ cs = p[0]; ce = p[1]; }
    else if (p[0] <= ce){ ce = Math.max(ce, p[1]); }
    else { tot += ce - cs; cs = p[0]; ce = p[1]; }
  });
  if (cs !== null) tot += ce - cs;
  return tot;
}
function pct(v){ return ((v - MIN) / SPAN * 100).toFixed(2); }
function fmt1(n){ return n.toLocaleString(S.lang === "pt" ? "pt-PT" : "en-GB", {minimumFractionDigits:1, maximumFractionDigits:1}); }
function domDot(k){ return '<span class="dot" style="background:' + DOM[k].c + '"></span>'; }

/* ---------- Blocos ---------- */
function header(u){
  return '<header class="top"><div class="wrap">' +
    '<div class="top-bar"><div class="lang" role="group" aria-label="' + u.langLabel + '">' +
    '<button data-act="lang" data-v="pt" data-key="lang-pt" aria-pressed="' + (S.lang==="pt") + '">PT</button>' +
    '<button data-act="lang" data-v="en" data-key="lang-en" aria-pressed="' + (S.lang==="en") + '">EN</button>' +
    '</div></div>' +
    '<h1>Ricardo Duarte</h1>' +
    '<p class="role-now">' + u.roleNow + '</p>' +
    '<p class="intro">' + u.intro + '</p>' +
    '<div class="actions">' +
    '<a class="btn primary" href="mailto:ricardo.duarte.80@gmail.com">' + u.email + '</a>' +
    '<a class="btn" href="https://www.linkedin.com/in/ricardo-duarte-80/" rel="noopener">' + u.linkedin + '</a>' +
    '</div></div></header>';
}

function filters(u, shown){
  var lg = S.lang;
  var dchips = '<button class="chip" data-act="dom" data-v="" data-key="dom-all" aria-pressed="' + (!S.dom) + '">' + u.all + '</button>';
  DOM_ORDER.forEach(function(k){
    dchips += '<button class="chip" data-act="dom" data-v="' + k + '" data-key="dom-' + k + '" aria-pressed="' + (S.dom===k) + '">' + domDot(k) + DOM[k][lg] + '</button>';
  });
  var tchips = "";
  TOOL_ORDER.forEach(function(k){
    tchips += '<button class="chip" data-act="tool" data-v="' + k + '" data-key="tool-' + k + '" aria-pressed="' + (S.tool===k) + '">' + TOOLS[k][lg] + '</button>';
  });
  var yearChip = S.year !== null ? '<button class="chip" data-act="year" data-v="' + S.year + '" data-key="year-chip" aria-pressed="true">' + u.year + ' ' + S.year + ' &times;</button>' : "";
  var any = S.dom || S.tool || S.year !== null;
  return '<section class="panel filters" aria-label="' + (S.lang === "pt" ? "Filtros" : "Filters") + '">' +
    '<p class="hint">' + u.hint + '</p>' +
    '<div class="fgroup"><p class="flabel">' + u.area + '</p><div class="chips">' + dchips + '</div></div>' +
    '<div class="fgroup"><p class="flabel">' + u.tool + '</p><div class="chips">' + tchips + yearChip + '</div></div>' +
    '<div class="frow"><p class="status" aria-live="polite">' + u.status.replace("{n}", shown).replace("{t}", ROLES.length) + '</p>' +
    (any ? '<button class="reset" data-act="reset" data-key="reset">' + u.reset + '</button>' : '') + '</div>' +
    '</section>';
}

function kpis(u, rs){
  var emps = {}, tools = {};
  rs.forEach(function(r){ emps[r.emp] = 1; r.tools.forEach(function(t){ tools[t] = 1; }); });
  var allEmp = {}, allTools = {};
  ROLES.forEach(function(r){ allEmp[r.emp] = 1; r.tools.forEach(function(t){ allTools[t] = 1; }); });
  var nEmp = Object.keys(emps).length, nTools = Object.keys(tools).length;
  var filtered = rs.length !== ROLES.length;
  function sub(tot){ return filtered ? ' <small>' + u.of + ' ' + tot + '</small>' : ''; }
  return '<div class="kpis">' +
    '<div class="kpi"><b>' + fmt1(union(rs)) + '</b><span>' + u.kYears + '</span></div>' +
    '<div class="kpi"><b>' + rs.length + '</b><span>' + u.kRoles + sub(ROLES.length) + '</span></div>' +
    '<div class="kpi"><b>' + nEmp + '</b><span>' + u.kEmp + sub(Object.keys(allEmp).length) + '</span></div>' +
    '<div class="kpi"><b>' + nTools + '</b><span>' + u.kTools + sub(Object.keys(allTools).length) + '</span></div>' +
    '</div>';
}

function timeline(u, shown){
  var lg = S.lang, ticks = "", lines = "";
  for (var y = MIN; y < MAX; y += 4){
    ticks += '<span style="left:' + pct(y) + '%">' + y + '</span>';
    lines += '<i style="left:' + pct(y) + '%"></i>';
  }
  var band = S.year !== null ? '<div class="band" style="left:' + pct(S.year) + '%;width:' + (100 / SPAN).toFixed(2) + '%"></div>' : "";
  var rows = "";
  ROLES.forEach(function(r, idx){
    var open = S.open === r.id;
    var dim = matches(r, true) ? "" : " dim";
    var w = ((end(r) - r.s) / SPAN * 100).toFixed(2);
    var li = "";
    r.b[lg].forEach(function(t){ li += "<li>" + t + "</li>"; });
    var tags = '<span class="tag dom">' + domDot(r.dom) + DOM[r.dom][lg] + '</span>';
    r.tools.forEach(function(k){
      tags += '<button class="tag" data-act="tool" data-v="' + k + '" data-key="tag-' + r.id + '-' + k + '" aria-pressed="' + (S.tool===k) + '">' + TOOLS[k][lg] + '</button>';
    });
    rows += '<li>' +
      '<button class="row' + dim + '" data-act="role" data-v="' + r.id + '" data-key="role-' + r.id + '" aria-expanded="' + open + '" aria-controls="d-' + r.id + '">' +
      '<span class="head"><span class="title">' + r.t[lg] + '<span class="org">' + r.o[lg] + '</span></span><span class="dates">' + r.d[lg] + '</span></span>' +
      '<span class="track"><span class="bar' + (r.now ? " now" : "") + '" style="left:' + pct(r.s) + '%;width:' + w + '%;--i:' + idx + ';--c:' + DOM[r.dom].c + '"></span></span>' +
      '</button>' +
      '<div class="detail" id="d-' + r.id + '"' + (open ? "" : " hidden") + '><ul>' + li + '</ul><div class="tags">' + tags + '</div></div>' +
      '</li>';
  });
  return '<section class="panel p-time" aria-labelledby="h-time">' +
    '<h2 id="h-time">' + u.timeline + '</h2><p class="sub">' + u.timelineSub + '</p>' +
    (shown === 0 ? '<p class="empty">' + u.empty + '</p>' : '') +
    '<div class="axis" aria-hidden="true">' + ticks + '</div>' +
    '<div class="plot' + (S.intro ? " intro-anim" : "") + '"><div class="lines" aria-hidden="true">' + lines + '</div>' + band +
    '<ol class="rows">' + rows + '</ol></div></section>';
}

function yearly(u){
  var lg = S.lang, cols = "", labels = "";
  var rs = ROLES.filter(function(r){ return matches(r, false); });
  for (var y = MIN; y < MAX; y++){
    var act = rs.filter(function(r){ return activeIn(r, y); });
    var segs = "";
    act.forEach(function(r){ segs += '<span class="seg" style="--c:' + DOM[r.dom].c + '"></span>'; });
    cols += '<button class="col" data-act="year" data-v="' + y + '" data-key="col-' + y + '" ' +
      (act.length ? "" : "disabled ") + 'aria-pressed="' + (S.year === y) + '" aria-label="' + y + ': ' + act.length + ' ' + u.roleWord + '">' + segs + '</button>';
    labels += '<span aria-hidden="true">' + (((y - MIN) % 4 === 0) ? y : "") + '</span>';
  }
  var legend = "";
  DOM_ORDER.forEach(function(k){ legend += '<span class="tag dom">' + domDot(k) + DOM[k][lg] + '</span>'; });
  return '<section class="panel p-year" aria-labelledby="h-year">' +
    '<h2 id="h-year">' + u.yearly + '</h2><p class="sub">' + u.yearlySub + '</p>' +
    '<div class="bars' + (S.year !== null ? " pick" : "") + '">' + cols + '</div>' +
    '<div class="years">' + labels + '</div>' +
    '<div class="tags">' + legend + '</div></section>';
}

function education(u){
  var lg = S.lang, items = "";
  EDU.forEach(function(e){
    var g = "";
    if (e.grade !== null){
      g = '<div class="grade"><span>' + e.grade + ' / 20</span><i style="--w:' + (e.grade / 20 * 100) + '%"></i></div>';
    }
    var link = e.link ? ' <a href="' + e.link + '" rel="noopener">' + u.thesis + '</a>' : "";
    items += '<li><strong>' + e.t[lg] + '</strong><span class="meta">' + e.i[lg] + ', ' + e.y[lg] + ', ' + e.ects + ' ' + u.ects + link + '</span>' + g + '</li>';
  });
  return '<section class="panel p-edu" aria-labelledby="h-edu"><h2 id="h-edu">' + u.edu + '</h2><p class="sub">' + u.eduSub + '</p><ul class="edu">' + items + '</ul></section>';
}

function languages(u){
  var lg = S.lang, items = "";
  LANGS.forEach(function(l){
    var m = "";
    for (var i = 0; i < 6; i++){
      m += '<i class="' + (i < l.on ? "on" : (i < l.on + l.half ? "half" : "")) + '"></i>';
    }
    items += '<li><span>' + l.n[lg] + '</span><span class="lv"><span class="meter" aria-hidden="true">' + m + '</span>' + l.l[lg] + '</span></li>';
  });
  return '<section class="panel p-lang" aria-labelledby="h-lang"><h2 id="h-lang">' + u.langs + '</h2><p class="sub">' + u.langsSub + '</p><ul class="langs">' + items + '</ul></section>';
}

/* ---------- Render ---------- */
var app = document.getElementById("app");

function render(){
  var u = UI[S.lang];
  var rs = ROLES.filter(function(r){ return matches(r, true); });
  var activeKey = document.activeElement && document.activeElement.getAttribute ? document.activeElement.getAttribute("data-key") : null;

  document.documentElement.lang = S.lang === "pt" ? "pt-PT" : "en";
  document.title = u.docTitle;

  app.innerHTML = header(u) +
    '<main class="wrap">' +
    filters(u, rs.length) +
    kpis(u, rs) +
    '<div class="dash">' + timeline(u, rs.length) + yearly(u) + education(u) + languages(u) + '</div>' +
    '<section class="panel contact" aria-label="' + (S.lang === "pt" ? "Contacto" : "Contact") + '">' +
    '<p>' + u.contactTxt + '</p>' +
    '<div class="actions"><a class="btn primary" href="mailto:ricardo.duarte.80@gmail.com">' + u.email + '</a>' +
    '<a class="btn" href="https://www.linkedin.com/in/ricardo-duarte-80/" rel="noopener">' + u.linkedin + '</a></div>' +
    '</section>' +
    '</main>' +
    '<footer><div class="wrap">' + u.footer + '</div></footer>';

  S.intro = false;

  if (activeKey){
    var el = app.querySelector('[data-key="' + activeKey + '"]');
    if (el && !el.disabled) el.focus({preventScroll:true});
  }
}

/* ---------- Interação ---------- */
app.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  var act = el.getAttribute("data-act"), v = el.getAttribute("data-v");
  if (act === "lang") S.lang = v;
  else if (act === "dom") S.dom = (v === "" || S.dom === v) ? null : v;
  else if (act === "tool") S.tool = (S.tool === v) ? null : v;
  else if (act === "year"){ var y = parseInt(v, 10); S.year = (S.year === y) ? null : y; }
  else if (act === "role") S.open = (S.open === v) ? null : v;
  else if (act === "reset"){ S.dom = null; S.tool = null; S.year = null; }
  render();
});

render();
})();
</script>
</body>
</html>
